<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blog Posts</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="preload" as="image" href="image2.jpg">
</head>
<body>
<!-- Modified button container -->
<div class="right-buttons">
    <button id="returning" onclick="returning()">Go to Menu</button>
    <button id="logout" onclick="logout()">Logout</button>
</div>

<!--Implementing the button-->
<script>
    function logout() {
        window.location.href = '/logout';
        // logout means logout
    }

    function returning() {
        window.location.href = '/index.html';
        //     It returns to the menu where u can change btw the private and public chat
    }
</script>

<div class="container">
    <div class="header-group">
        <h2>Blog Posts</h2>
        <a href="/blogs/new" class="button accent">Create New Post</a>
    </div>

    <div class="card-list">
        <div class="card" th:each="blog : ${blogs}">
            <div class="post-header">
                <h3 th:text="${blog.title}">Blog Title</h3>
                <time th:text="${#temporals.format(blog.createdAt, 'dd MMM yyyy HH:mm')}" class="text-muted"></time>
            </div>
            <div class="post-content" th:utext="${blog.content}"></div>
            <div class="post-footer">
                <div class="reactions">
                    <span class="likes" th:text="${blog.likes + ' ❤️'}"></span>
                    <span class="dislikes" th:text="${blog.dislikes + ' 💔'}"></span>
                </div>
                <a th:href="@{'/blogs/view/' + ${blog.id}}" class="button ghost">Read More</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
