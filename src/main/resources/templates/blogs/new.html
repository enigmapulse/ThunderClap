<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Blog Post</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="preload" as="image" href="image2.jpg">
</head>
<body>
<!-- Modified button container -->
<div class="right-buttons">
    <button id="returning" onclick="returning()">Go to Menu</button>
    <button id="logout" onclick="logout()">Logout</button>
</div>

<!--Implementing the button-->
<script>
    function logout() {
        window.location.href = '/logout';
        // logout means logout
    }

    function returning() {
        window.location.href = '/index.html';
        //     It returns to the menu where u can change btw the private and public chat
    }
</script>
<div class="container">
    <h2>Create Blog Post</h2>
    <!-- Updated new.html form structure -->
    <form th:action="@{/blogs}" method="post" enctype="multipart/form-data" class="card">
        <div class="input-group">
            <label class="input-label">Title</label>
            <input type="text" name="title" required class="modern-input"
                   placeholder="Amazing Blog Post Title">
        </div>

        <div class="input-group">
            <label class="input-label">Content</label>
            <textarea name="content" rows="10" required class="modern-input"
                      placeholder="Start writing your masterpiece here..."></textarea>
        </div>

        <div class="button-group">
            <button type="submit" class="primary">
                <span class="button-icon">📝</span>
                Publish Post
            </button>
        </div>
    </form>
</div>
</body>
</html>
