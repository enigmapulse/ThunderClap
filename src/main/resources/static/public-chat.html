<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebSocket Chat</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Add this CSS to your existing styles */
        .right-buttons {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 10px;
        }

        .right-buttons button {
            /*padding: 8px 16px;*/
            background: var(--gradient, linear-gradient(135deg, #7289DA 0%, #5865F2 100%));
            /*background: #dc3545;*/
            padding: 1rem 2rem;
            margin: 0.75rem;
            border-radius: 0.75rem;
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-block;
            box-shadow: var(--shadow, 0 8px 32px rgba(0,0,0,0.15));
            /*color: white;*/
            border: none;
            /*border-radius: 4px;*/
            cursor: pointer;
        }

        .right-buttons button:hover {
            /*background: #c82333;*/
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(114,137,218,0.3);
        }

        /* Add margin to prevent content overlap */
        body {
            margin-top: 70px;
        }
    </style>
</head>
<body>
<h2>ChatRoom</h2>
<p id="displayUsername"></p>

<!-- Modified button container -->
<div class="right-buttons">
    <button id="returning" onclick="returning()">Go to Menu</button>
    <button id="logout" onclick="logout()">Logout</button>
</div>

<!--Implementing the button-->
<script>
    function logout() {
        window.location.href = '/logout';
        // logout means logout
    }

    function returning() {
        window.location.href = '/index.html';
        //     It returns to the menu where u can change btw the private and public chat
    }
</script>


<!-- Rest of your existing code remains unchanged -->
<ul id="messageArea"></ul>

<div class="input-group">
    <input type="text" id="message" placeholder="Type a message..." />
    <label for="imageInput" class="file-upload-label">
        &#128247;
    </label>
    <button id="sendButton">Send</button>
    <input type="file" id="imageInput" accept="image/*" style="display: none;" />
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script src="main.js"></script>
</body>
</html>
