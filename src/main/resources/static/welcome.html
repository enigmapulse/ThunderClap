<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            /*background-image: url('image2.jpg');*/
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            background-color: #000000; /* Fallback color */
            color: var(--text, #fff);
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            margin: 0 0 1rem;
            background: linear-gradient(135deg, #7289DA 0%, #5865F2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .btn {
            background: var(--gradient, linear-gradient(135deg, #7289DA 0%, #5865F2 100%));
            padding: 1rem 2rem;
            margin: 0.75rem;
            border-radius: 0.75rem;
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-block;
            box-shadow: var(--shadow, 0 8px 32px rgba(0,0,0,0.15));
        }
        .btn:hover {
            transform: translateY(-2px);
            /*box-shadow: 0 12px 40px rgba(114,137,218,0.3);*/
        }
        #userOptions, #guestOptions {
            background: var(--surface, #2f3136);
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: var(--shadow);
            max-width: 500px;
            width: 100%;
        }
        p {
            color: var(--text-muted, #b9bbbe);
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <h1>Welcome</h1>
    <div id="userOptions" style="display:none;">
    <p>Logged in as <strong id="usernameDisplay"></strong></p>
    <a href="/index.html" class="btn">Start Chatting →</a>
    </div>
    <div id="guestOptions" style="display:none;">
        <p>Join the conversation</p>
        <a href="/login" class="btn">Sign In</a>
        <a href="/registration.html" class="btn">Create Account</a>
    </div>
    <script>
        fetch('/username')
            .then(response => response.text())
            .then(data => {
                const username = data.trim();
                if (username && username !== "Anonymous") {
                    document.getElementById("usernameDisplay").textContent = username;
                    document.getElementById("userOptions").style.display = "block";
                } else {
                    document.getElementById("guestOptions").style.display = "block";
                }
            })
            .catch(error => {
                console.error('Error fetching username:', error);
                document.getElementById("guestOptions").style.display = "block";
            });
    </script>
    <script src="theme.js"></script>
    </body>
</html>
