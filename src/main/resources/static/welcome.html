<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f2f2f2; text-align: center; margin-top: 50px; }
        .btn { padding: 10px 20px; margin: 10px; background: #5865F2; color: #fff; border: none; border-radius: 4px; text-decoration: none; }
    </style>
</head>
<body>
<h1 id="welcomeMessage">Welcome!</h1>
<div id="userOptions" style="display:none;">
    <p>You are logged in as <span id="usernameDisplay"></span>.</p>
    <a href="/index.html" class="btn">Join Chatroom</a>
</div>
<div id="guestOptions" style="display:none;">
    <p>You are not logged in.</p>
    <a href="/login" class="btn">Login</a>
    <a href="/registration.html" class="btn">Register</a>
</div>
<script>
    fetch('/username')
        .then(response => response.text())
        .then(data => {
            const username = data.trim();
            if (username && username !== "Anonymous") {
                document.getElementById("usernameDisplay").textContent = username;
                document.getElementById("userOptions").style.display = "block";
            } else {
                document.getElementById("guestOptions").style.display = "block";
            }
        })
        .catch(error => {
            console.error('Error fetching username:', error);
            document.getElementById("guestOptions").style.display = "block";
        });
</script>
</body>
</html>
