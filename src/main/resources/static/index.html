<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Chat</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
    <style>
        :root {
            --primary: #7289DA;
            --primary-hover: #5b6eae;
            --background: #18191c;
            --surface: #2f3136;
            --text: #ffffff;
            --text-muted: #b9bbbe;
            --gradient: linear-gradient(135deg, #7289DA 0%, #5865F2 100%);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background: var(--surface);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: var(--shadow);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        h2 {
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
        }

        input, button, select {
            width: 100%;
            padding: 1rem;
            margin-top: 1rem;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
        }

        input {
            background: var(--surface);
            color: var(--text);
            border: 2px solid var(--surface);
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(114,137,218,0.25);
            outline: none;
        }

        select {
            background: var(--surface);
            color: var(--text);
        }

        button {
            background: var(--gradient);
            color: white;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        button:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>Chat Login</h2>

    <form id="chatForm" method="GET">
        <select id="chatType" name="chatType">
            <option value="public">Public Chat</option>
            <option value="private">Private Chat</option>
            <option value="blog">Blogs</option>
        </select>
        <button type="submit">Join Chat</button>
    </form>

    <script>
        document.getElementById("chatForm").addEventListener("submit", function (e) {
            e.preventDefault(); // Prevent the default form submission behavior

            let chatType = document.getElementById("chatType").value;
            // Redirect to the appropriate chat URL
            window.location.href = chatType === "public" ? "public-chat.html" : (chatType === "private" ? "private-chat.html" : "/blogs");

            // Connect to the server only if it's public chat
            if (chatType === "public") {
                fetch('/username')
                    .then(response => response.text())
                    .then(data => {
                        username = data.trim();
                        document.getElementById("displayUsername").textContent = "Logged in as: " + username;
                        connect(); // Call the provided connect() function to join the chatroom
                    })
                    .catch(error => console.error('Error fetching username:', error));
            } else {
                console.log("Connection not required for private chat.");
            }
        });
    </script>

    <button id="logout" onclick = logout() >Logout</button>

    <script>
        function logout() {
            window.location.href = '/logout';
            // logout means logout
        }
    </script>

</div>
</body>
</html>
