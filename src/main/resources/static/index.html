<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Chat</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
    <link rel="stylesheet" href="index-styles.css">


</head>
<body>
<div class="login-container">
    <h2>Chat Login</h2>

    <form id="chatForm" method="GET">
        <select id="chatType" name="chatType">
            <option value="public">Public Chat</option>
            <option value="private">Private Chat</option>
            <option value="blog">Blogs</option>
        </select>
        <button type="submit">Join Chat</button>
    </form>

    <script>
        document.getElementById("chatForm").addEventListener("submit", function (e) {
            e.preventDefault(); // Prevent the default form submission behavior

            let chatType = document.getElementById("chatType").value;
            // Redirect to the appropriate chat URL
            window.location.href = chatType === "public" ? "public-chat.html" : (chatType === "private" ? "private-chat.html" : "/blogs");

            // Connect to the server only if it's public chat
            if (chatType === "public") {
                fetch('/username')
                    .then(response => response.text())
                    .then(data => {
                        username = data.trim();
                        document.getElementById("displayUsername").textContent = "Logged in as: " + username;
                        connect(); // Call the provided connect() function to join the chatroom
                    })
                    .catch(error => console.error('Error fetching username:', error));
            } else {
                console.log("Connection not required for private chat.");
            }
        });
    </script>

    <button id="logout" onclick = logout() >Logout</button>

    <script>
        function logout() {
            window.location.href = '/logout';
            // logout means logout
        }
    </script>

</div>

</body>
</html>
