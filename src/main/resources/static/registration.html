<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            background-color: #000000;
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        form {
            background: var(--surface, #2f3136);
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: var(--shadow, 0 8px 32px rgba(0,0,0,0.15));
            width: 100%;
            max-width: 400px;
        }
        h2 {
            color: #fff;
            text-align: center;
            margin: 0 0 2rem;
            font-size: 2rem;
        }
        input {
            width: 100%;
            padding: 1rem;
            margin: 0.75rem 0;
            border: 2px solid #40444b;
            border-radius: 0.75rem;
            background: var(--background, #18191c);
            color: var(--text, #fff);
            transition: all 0.3s ease;
        }
        input:focus {
            border-color: var(--primary, #7289DA);
            box-shadow: 0 0 0 4px rgba(114,137,218,0.25);
        }
        button {
            background: var(--gradient, linear-gradient(135deg, #7289DA 0%, #5865F2 100%));
            width: 100%;
            padding: 1rem;
            margin-top: 1rem;
            font-weight: 600;
        }
        p {
            color: var(--text-muted, #b9bbbe);
            text-align: center;
            margin-top: 1.5rem;
        }
        a {
            color: var(--primary, #7289DA);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
<form method="post" action="/register">
    <h2>Create Account</h2>
    <input type="text" id="username" name="username" placeholder="Username" required>
    <input type="password" id="password" name="password" placeholder="Password" required>
    <button type="submit">Continue</button>
    <p>Already have an account? <a href="/login">Sign in</a></p>
</form>

</body>
</html>
